name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check syntax
        run: |
          python -m py_compile src/main.py
          python -m py_compile src/config.py
          python -m py_compile src/github_api.py
          python -m py_compile src/sync/__init__.py
          python -m py_compile src/sync/repository.py
          python -m py_compile src/sync/labels.py
          python -m py_compile src/sync/branches.py

  validate-examples:
    name: Validate Examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON examples
        run: |
          python -c "import json; json.load(open('examples/basic-settings.json'))"
          python -c "import json; json.load(open('examples/full-settings.json'))"

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t github-settings-sync-action .

  test-dry-run:
    name: Test Dry Run
    runs-on: ubuntu-latest
    needs: [lint, docker-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create test settings
        run: |
          mkdir -p .github
          cat > .github/settings.json << 'EOF'
          {
            "repository": {
              "description": "Test repository"
            },
            "labels": [
              {"name": "test-label", "color": "ff0000", "description": "Test"}
            ]
          }
          EOF

      - name: Test action (dry run)
        uses: ./
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          dry_run: true
